<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfólio | Take Cut</title>
<link rel="icon" type="image/png" href="/logo1.png">
<link rel="stylesheet" href="/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .portfolio-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 40px;
    text-align: center;
  }
  .portfolio-page h1 {
    font-size: 40px;
    font-weight: 800;
    color: #F5F5F5;
    margin-bottom: 12px;
    text-shadow: 0 0 15px rgba(0,255,178,0.25);
  }
  .portfolio-page .subtitle {
    opacity: 0.6;
    font-size: 16px;
    margin-bottom: 60px;
  }
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .portfolio-grid-item {
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 16/9;
    background: #1A1A1D;
  }
  .portfolio-grid-item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* TAREFA 3: botão voltar profissional */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: #0B0B0C;
    background: #00FFB2;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 8px;
    margin-bottom: 50px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }
  .back-btn::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transition: 0.4s;
  }
  .back-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,255,178,0.4); }
  .back-btn:hover::after { left: 100%; }
  .back-btn:active { transform: scale(0.97); }
  .back-btn .arrow { display: inline-block; transition: transform 0.3s ease; font-size: 18px; line-height: 1; }
  .back-btn:hover .arrow { transform: translateX(-4px); }

  .video-card {
  position: relative;
  overflow: hidden;
}

.video-thumb {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 1;
  pointer-events: none;
  transition: opacity .3s ease;
}

.video-card video {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  background: transparent;
}

  @media (max-width: 768px) {
    .portfolio-page { padding: 40px 16px; }
    .portfolio-page h1 { font-size: 28px; }
    .portfolio-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>

<header class="navbar">
  <!-- TAREFA 8: logo leva para / sem index.html -->
  <a href="/" class="logo"><img src="logo.png" alt="Take Cut Logo" width="120" height="40"></a>
  <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  <!-- TAREFA 9: links sem index.html + TAREFA 3: Equipamentos no menu -->
  <nav class="nav-links">
    <a href="/">Home</a>
    <a href="/#portfolio">Portfólio</a>
    <a href="/produtos">Equipamentos</a>
    <a href="/#services">Serviços</a>
    <a href="/#contact">Contato</a>
  </nav>
</header>

<div class="portfolio-page">
  <a href="/" class="back-btn">
    <span class="arrow">←</span> Voltar ao site
  </a>
  <h1>Nosso Portfólio</h1>
  <p class="subtitle">Todos os nossos trabalhos em um só lugar.</p>

<div class="portfolio-grid-item video-card">

  <img src="/thumbp1.png" class="video-thumb">

  <video controls preload="none">
    <source src="/video1.mp4" type="video/mp4">
  </video>

</div>
  
<div class="portfolio-grid-item video-card">

  <img src="/thumbp2.png" class="video-thumb">

  <video controls preload="none">
    <source src="/video2.mp4" type="video/mp4">
  </video>

</div>
  
<div class="portfolio-grid-item video-card">

  <img src="/thumbp3.png" class="video-thumb">

  <video controls preload="none">
    <source src="/video3.mp4" type="video/mp4">
  </video>

</div>
  
<div class="portfolio-grid-item video-card">

  <img src="/thumbp4.png" class="video-thumb">

  <video controls preload="none">
    <source src="/video4.mp4" type="video/mp4">
  </video>

</div>
  
   <div class="portfolio-grid-item video-card">

  <img src="/thumbp5.png" class="video-thumb">

  <video controls preload="none">
    <source src="/video5.mp4" type="video/mp4">
  </video>

</div>
  </div>
</div>

<footer class="footer">
  <p>© 2026 Take Cut. Todos os direitos reservados.</p>
</footer>

<script>
// TAREFA 3: cometas e estrelas no fundo
function createUniverse() {
  const starsBg = document.getElementById("starsBg");
  const isMobile = window.innerWidth <= 768;
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < (isMobile ? 40 : 80); i++) {
    const star = document.createElement("div");
    star.className = "stars";
    star.style.cssText = "left:" + (Math.random()*100) + "%;top:" + (Math.random()*100) + "%;animation-delay:" + (Math.random()*3) + "s;animation-duration:" + (Math.random()*3+2) + "s";
    fragment.appendChild(star);
  }
  for (let i = 0; i < (isMobile ? 1 : 3); i++) {
    const comet = document.createElement("div");
    comet.className = "comet";
    comet.style.cssText = "left:" + (Math.random()*100) + "%;top:" + (Math.random()*50) + "%;animation-delay:" + (Math.random()*3) + "s;animation-duration:" + (Math.random()*4+6) + "s";
    fragment.appendChild(comet);
  }
  starsBg.appendChild(fragment);
}
window.addEventListener("load", createUniverse);

// Menu mobile
function toggleMenu() {
  document.querySelector(".nav-links").classList.toggle("active");
}
document.addEventListener("DOMContentLoaded", function() {
  document.querySelectorAll(".nav-links a").forEach(function(link) {
    link.addEventListener("click", function() {
      document.querySelector(".nav-links").classList.remove("active");
    });
  });
});

// Lazy load vídeos
if ("IntersectionObserver" in window) {
  const obs = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        const v = entry.target;
        if (v.readyState === 0) v.load();
        obs.unobserve(v);
      }
    });
  }, { rootMargin: "200px" });
  document.querySelectorAll("video[preload='none']").forEach(function(v) { obs.observe(v); });
}
</script>
</body>
</html>
