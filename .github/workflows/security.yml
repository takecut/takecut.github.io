name: Static site security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Static security checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without keeping credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install locked validator dependencies without lifecycle scripts
        # Vulnerability auditing remains mandatory in the next step.
        # Bound network retries and expose download errors instead of timing out silently.
        run: npm ci --prefix _security --ignore-scripts --no-audit --fetch-timeout=30000 --fetch-retries=1 --loglevel=verbose
      - name: Check validator dependencies for known vulnerabilities
        run: npm audit --prefix _security --audit-level=high --fetch-timeout=30000 --fetch-retries=1
      - name: Validate static-site protections
        run: node _security/check.cjs
      - name: Validate project catalog, routes and assets
        run: node _studio/check.cjs
      - name: Validate home media overrides and search entities
        run: node _studio/revision-check.cjs
      - name: Validate niche pages and service metadata
        run: node _studio/niches-check.cjs
      - name: Validate pricing page, public terms and plan inquiries
        run: node _studio/plans-check.cjs
      - name: Validate desktop thumbnail sources and original asset integrity
        run: node _studio/desktop-thumbnails-check.cjs
      - name: Verify generated pages match their sources
        run: |
          node _studio/build.cjs
          git diff --exit-code -- '*.html' sitemap.xml
