name: Static site security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Static security checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without keeping credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked validator dependencies without lifecycle scripts
        run: npm ci --prefix _security --ignore-scripts
      - name: Check validator dependencies for known vulnerabilities
        run: npm audit --prefix _security --audit-level=high
      - name: Validate static-site protections
        run: node _security/check.cjs
      - name: Validate project catalog, routes and assets
        run: node _studio/check.cjs
      - name: Validate home media overrides and search entities
        run: node _studio/revision-check.cjs
      - name: Verify generated pages match their sources
        run: |
          node _studio/build.cjs
          git diff --exit-code -- '*.html' sitemap.xml
